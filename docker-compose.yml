version: '3.8'

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  tester:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_ADMIN_PASS=postgres_password
      - PITCHFORK_TOOLNAME=pitchfork
      - PITCHFORK_CONFROOT=/app/test/config
    volumes:
      - .:/app

volumes:
  pgdata:
